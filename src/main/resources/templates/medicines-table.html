<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список лекарств</title>
    <link rel="stylesheet" href="/scripts/styles/medicine-table.css">
    <link rel="stylesheet" href="/scripts/styles/style.css">
    <script src="/scripts/medicine-table.js" defer></script>
    <script src="/scripts/header.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div th:insert="header :: header"></div>
    <div class="container">
        <h1 class="title">СПИСОК ЛЕКАРСТВ</h1>

        <!-- Кнопка для добавления нового лекарства -->
        <button id="add-medicine-btn" class="btn">Добавить лекарство</button>

        <!-- Таблица с лекарствами -->
        <table class="medicine-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название лекарства</th>
                    <th>Производитель</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="medicine-table-body">
                <!-- Данные будут добавляться динамически через JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Модальное окно с деталями лекарства -->
    <div id="medicine-details-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal">&times;</span>
            <h2>Детали лекарства</h2>
            <p id="medicine-detail-id"><strong>ID:</strong> </p>
            <p id="medicine-detail-name"><strong>Название лекарства:</strong> </p>
            <p id="medicine-detail-manufacturer"><strong>Производитель:</strong> </p>
            <button id="edit-medicine-btn" class="btn">Редактировать</button>
            <button id="delete-medicine-btn" class="btn">Удалить</button>
        </div>
    </div>

    <!-- Модальное окно для добавления/редактирования лекарства -->
    <div id="medicine-form-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-form-modal">&times;</span>
            <h2 id="form-title">Добавить лекарство</h2>
            <form id="medicine-form">
                <input type="hidden" id="medicine-id" name="id">
                <label for="medicine-name">Название лекарства:</label>
                <input type="text" id="medicine-name" name="medicineName" required>
                <label for="manufacturer">Производитель:</label>
                <input type="text" id="manufacturer" name="manufacturer" required>
                <button type="submit" class="btn">Сохранить</button>
            </form>
        </div>
    </div>

    <div th:insert="footer :: footer"></div>
</body>
</html>
