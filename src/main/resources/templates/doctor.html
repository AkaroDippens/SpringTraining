<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список врачей</title>
    <link rel="stylesheet" href="/scripts/styles/doctor-table.css">
    <link rel="stylesheet" href="/scripts/styles/style.css">
    <script src="/scripts/doctor-table.js" defer></script>
    <script src="/scripts/header.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div th:insert="header :: header"></div>
    <div class="container">
        <h1 class="title">СПИСОК ВРАЧЕЙ</h1>

        <!-- Таблица с врачами -->
        <table class="doctor-table">
            <thead>
                <tr>
                    <th>ФИО</th>
                    <th>Специализация</th>
                    <th>Строение</th>
                    <th>Стаж</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="doctor-table-body">
                <!-- Данные будут добавляться динамически через JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Модальное окно с деталями врача -->
    <div id="doctor-details-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal">&times;</span>
            <h2>Детали врача</h2>
            <p id="doctor-detail-full-name"><strong>ФИО:</strong> </p>
            <p id="doctor-detail-specialization"><strong>Специализация:</strong> </p>
            <p id="doctor-detail-building"><strong>Строение:</strong> </p>
            <p id="doctor-detail-experience"><strong>Стаж:</strong> </p>
            <button id="change-specialization-btn" class="btn">Изменить специализацию</button>
        </div>
    </div>

    <!-- Модальное окно для изменения специализации -->
    <div id="change-specialization-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-change-specialization-modal">&times;</span>
            <h2>Изменить специализацию</h2>
            <form id="change-specialization-form">
                <input type="hidden" id="doctor-id" name="id">
                <label for="specialization">Специализация:</label>
                <select id="specialization" name="specialization" required>
                    <!-- Опции будут добавляться динамически через JavaScript -->
                </select>
                <button type="submit" class="btn">Сохранить</button>
            </form>
        </div>
    </div>

    <div th:insert="footer :: footer"></div>
</body>
</html>
