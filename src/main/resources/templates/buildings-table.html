<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список зданий</title>
    <link rel="stylesheet" href="/scripts/styles/building-table.css">
    <link rel="stylesheet" href="/scripts/styles/style.css">
    <script src="/scripts/building-table.js" defer></script>
    <script src="/scripts/header.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div th:insert="header :: header"></div>
    <div class="container">
        <h1 class="title">СПИСОК ЗДАНИЙ</h1>

        <!-- Кнопка для добавления нового здания -->
        <button id="add-building-btn" class="btn">Добавить здание</button>

        <!-- Таблица со зданиями -->
        <table class="building-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название здания</th>
                    <th>Адрес</th>
                    <th>Контактный номер</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="building-table-body">
                <!-- Данные будут добавляться динамически через JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Модальное окно с деталями здания -->
    <div id="building-details-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal">&times;</span>
            <h2>Детали здания</h2>
            <p id="building-detail-id"><strong>ID:</strong> </p>
            <p id="building-detail-name"><strong>Название здания:</strong> </p>
            <p id="building-detail-address"><strong>Адрес:</strong> </p>
            <p id="building-detail-contact"><strong>Контактный номер:</strong> </p>
            <button id="edit-building-btn" class="btn">Редактировать</button>
            <button id="delete-building-btn" class="btn">Удалить</button>
        </div>
    </div>

    <!-- Модальное окно для добавления/редактирования здания -->
    <div id="building-form-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-form-modal">&times;</span>
            <h2 id="form-title">Добавить здание</h2>
            <form id="building-form">
                <input type="hidden" id="building-id" name="id">
                <label for="building-name">Название здания:</label>
                <input type="text" id="building-name" name="buildingName" required>
                <label for="address">Адрес:</label>
                <input type="text" id="address" name="address" required>
                <label for="contact-number">Контактный номер:</label>
                <input type="text" id="contact-number" name="contactNumber" required>
                <button type="submit" class="btn">Сохранить</button>
            </form>
        </div>
    </div>

    <div th:insert="footer :: footer"></div>
</body>
</html>
