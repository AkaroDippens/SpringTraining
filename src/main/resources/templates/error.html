<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>404 - Страница не найдена</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7fafc;
        }

        .error-container {
            max-width: 600px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease;
        }

        .error-code {
            font-size: 4rem;
            font-weight: bold;
            color: #0061ff;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 1rem;
        }

        .error-description {
            font-size: 1rem;
            color: #718096;
            margin-bottom: 2rem;
        }

        .action-button {
            padding: 0.75rem 1.5rem;
            background: #0061ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
            text-decoration: none;
        }

        .action-button:hover {
            background: #0052d6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-message">Страница не найдена</div>
        <div class="error-description">
            К сожалению, запрашиваемая страница отсутствует или была удалена.<br>
            Попробуйте вернуться на главную страницу.
        </div>
        <a href="/" class="action-button">На главную</a>
    </div>
</body>
</html>
